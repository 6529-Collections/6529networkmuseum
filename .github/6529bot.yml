version: 1
enabled: true

reviewKinds:
  # App Runner production catalog eefe911e-202606222152 currently rejects
  # stream-contracts. Keep the deployed-compatible set fail-safe until the
  # central review job is upgraded; Stream routing remains documented below.
  allowed: [general, followup, security, deploy-actions, media-external, privacy-evidence, glm-swarm]
  initial: [general, security, privacy-evidence, glm-swarm]
  followup: [followup]

commands:
  enabled: true

lanes:
  - provider: anthropic
    model: claude-opus-4-8

limits:
  maxJobsPerDelivery: 4

admission:
  publicRepoMode: trusted
  privateRepoMode: open
  draftPrMode: allow
  trustedPermission: write
  trustedUsers: []
  trustedTeams: [6529seize-maintainers]
  trustedOrganizations: [6529-Collections]
  denyUsers: []

budget:
  mode: enforce
  defaultEstimatedCostUsd: 1
  caps:
    repo:
      dailyUsd: 50
      weeklyUsd: 300
      monthlyUsd: 1000
    requestor:
      dailyUsd: 20
    pr:
      dailyUsd: 15
    review_kind:
      dailyUsd: 25
