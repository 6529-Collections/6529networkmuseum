name: Validate Museum control plane

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: museum-control-plane-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: schemas-records-manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
      - name: Run control-plane tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository records and schemas
        run: python scripts/validate.py
      - name: Check deterministic release manifest
        run: python scripts/generate_manifest.py --check
