name: Museum validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: museum-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-stream-catalog:
    name: focused-stream-catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch exact Stream v2 source object
        shell: pwsh
        run: |
          $streamSourceRoot = Join-Path $env:RUNNER_TEMP "6529Stream"
          git init --bare $streamSourceRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $streamSourceRoot fetch --no-tags --depth=1 https://github.com/6529-Collections/6529Stream.git f610e04979bf9a8f4f48b31131e7e0e8f78bac43
          exit $LASTEXITCODE

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Run focused Stream and publication-catalog tests
        env:
          STREAM_SOURCE_ROOT: ${{ runner.temp }}/6529Stream
        run: >-
          python -m unittest
          tests.test_stream_adapter_and_publication_catalog
          tests.test_manifest_binary_modes
          -v

  public-publication:
    name: public-publication-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Check deterministic public publication inventory
        run: python scripts/generate_public_publication_inventory.py --check

      - name: Check deterministic public publication bundle
        run: python scripts/generate_public_publication_bundle.py --check

      - name: Check deterministic public entity migration
        run: python scripts/migrate_public_entities.py --check

  validate:
    name: Museum validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch exact Stream v2 source object
        shell: pwsh
        run: |
          $streamSourceRoot = Join-Path $env:RUNNER_TEMP "6529Stream"
          git init --bare $streamSourceRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $streamSourceRoot fetch --no-tags --depth=1 https://github.com/6529-Collections/6529Stream.git f610e04979bf9a8f4f48b31131e7e0e8f78bac43
          exit $LASTEXITCODE

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12.10"

      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Run bootstrap record checks
        run: python scripts/bootstrap_validate.py

      - name: Check deterministic public entity migration
        run: python scripts/migrate_public_entities.py --check

      - name: Check proposed-gift voter dossiers
        run: python scripts/build_proposed_gift_dossiers.py --check

      - name: Check network fetch guard
        run: python scripts/check_fetch_guard.py

      - name: Check WP-3 Magnum public corpus and media policy
        run: |
          python content/wp-3-magnum/reviews/check_public_utf8.py
          python content/wp-3-magnum/reviews/check_local_references.py
          python content/wp-3-magnum/reviews/check_copy_citations.py
          python content/wp-3-magnum/reviews/check_media_policy.py

      - name: Run control-plane tests
        env:
          STREAM_SOURCE_ROOT: ${{ runner.temp }}/6529Stream
        run: python -m unittest discover -s tests -v

      - name: Verify rights handbook and legal texts
        run: |
          python scripts/validate_rights_handbook.py
          python scripts/sync_rights_legal_texts.py

      - name: Check Keys and Gates media derivatives
        run: python scripts/generate_program_media.py --check

      - name: Check institutional source inventory
        run: python scripts/generate_institutional_source_inventory.py --check

      - name: Run full schema and semantic validation
        run: python scripts/validate_full_with_casey.py

      - name: Check deterministic release manifest
        run: python scripts/generate_manifest.py --check

      - name: Run NextGen compatibility tests
        run: python -m unittest tests.rarity.test_nextgen_compat -v

      - name: Run Casey package mutation tests
        run: python -m unittest tests.casey.test_casey_snapshot_mutations -v

      - name: Verify Casey snapshot and descriptor package
        run: python scripts/verify_casey_snapshot_package.py

      - name: Check Casey post-accession diligence evidence manifest
        run: python scripts/build_casey_diligence_manifest.py --check

  deterministic:
    name: deterministic-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch exact Stream v2 source object
        shell: pwsh
        run: |
          $streamSourceRoot = Join-Path $env:RUNNER_TEMP "6529Stream"
          git init --bare $streamSourceRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $streamSourceRoot fetch --no-tags --depth=1 https://github.com/6529-Collections/6529Stream.git f610e04979bf9a8f4f48b31131e7e0e8f78bac43
          exit $LASTEXITCODE

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.2.0
        with:
          python-version: "3.12.10"

      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Run portable validation suite
        env:
          STREAM_SOURCE_ROOT: ${{ runner.temp }}/6529Stream
        run: |
          python scripts/bootstrap_validate.py
          python scripts/build_proposed_gift_dossiers.py --check
          python scripts/check_fetch_guard.py
          python content/wp-3-magnum/reviews/check_public_utf8.py
          python content/wp-3-magnum/reviews/check_local_references.py
          python content/wp-3-magnum/reviews/check_copy_citations.py
          python content/wp-3-magnum/reviews/check_media_policy.py
          python -m unittest discover -s tests -v
          python scripts/validate_rights_handbook.py
          python scripts/sync_rights_legal_texts.py
          python scripts/generate_program_media.py --check
          python scripts/generate_institutional_source_inventory.py --check
          python scripts/migrate_public_entities.py --check
          python scripts/validate_full_with_casey.py
          python scripts/build_casey_diligence_manifest.py --check
          python scripts/generate_manifest.py --check
